spring.application.name=homebanking-backend

# Conexion a Supabase (Session Pooler - IPv4)
# Estos valores se leen de variables de entorno; si no existen, usa el default local de la derecha.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.rhorijranxeniuqiczy}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
